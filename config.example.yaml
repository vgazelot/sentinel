watchers:
  # PRs waiting for your review (by name or through a team), sorted into lanes:
  # asked by name → pushed; asked of a team → pushed only if still unclaimed after the grace period;
  # a bot's dependency bump → grouped, never pushed. login/orgs are shared by every GitHub feature.
  github_reviews:
    enabled: true
    interval_seconds: 180
    login: your-github-username
    orgs: [your-org, another-org]

  # Generic Atlassian Statuspage watcher — works with any status page exposing
  # /api/v2/summary.json (Scaleway, OVHcloud, GitHub, Cloudflare, ...).
  # Filtering: components = an affected component must match (substring);
  # keywords = additional AND restriction, matched at word start (gra → GRA1, not degraded).
  # Planned maintenance is listed, never pushed; `notify: quiet` does the same for a whole page.
  statuspage:
    enabled: true
    interval_seconds: 300
    instances:
      # Scaleway components = product names without region (region only appears in the title)
      - name: scaleway
        url: https://status.scaleway.com/api/v2/summary.json
        components: [Instances, Object Storage, Load Balancer]
        keywords: []
        include_maintenances: true
      # OVH bare-metal incidents are per rack: keep the datacenters that host your servers
      # (keywords match the [RBX8] tag of the title) and list them without pushing
      - name: ovh-baremetal
        url: https://bare-metal-servers.status-ovhcloud.com/api/v2/summary.json
        components: [GRA, RBX, SBG]
        keywords: [rbx8, gra3]
        include_maintenances: false
        notify: quiet
      - name: ovh-network
        url: https://network.status-ovhcloud.com/api/v2/summary.json
        components: []
        keywords: [france, europe, gra, rbx, sbg]
        include_maintenances: false

  # Zabbix: open problems, shown on the Watch page. Dependent problems are hidden the way Zabbix
  # hides them, acknowledged ones only counted. A problem at push_severity or above is also an inbox
  # item (lane watch, pushed), unless its name matches one of `quiet` (known noise, listed apart).
  zabbix:
    enabled: false
    interval_seconds: 120
    url: https://zabbix.example.com/api_jsonrpc.php
    web_url: https://zabbix.example.com
    token_env: ZABBIX_TOKEN          # an API token (Zabbix 5.4+), in .env
    client_cert: /certs/client.crt   # optional: a front behind mutual TLS (docker-compose mounts SENTINEL_CERTS on /certs)
    client_key: /certs/client.key
    ca_cert: /certs/ca.crt           # optional: a private CA
    min_severity: 2                  # 0 not classified … 5 disaster
    push_severity: 4                 # high and above are pushed
    quiet: []                        # regexes on the problem name

  # Grafana: the dashboards you keep open, read back every few minutes (Graphite panels), each one
  # its own source. Each curve's last 30 min is compared with the hours before: a counter that stops
  # or a whole-number gauge that changes is pushed once seen on two reads in a row, a drift is
  # listed. Paste the links as you open them: their var-… parameters are the template variables used.
  grafana:
    enabled: false
    interval_seconds: 300
    url: https://grafana.example.com # the token only goes there: links elsewhere are refused
    token_env: GRAFANA_TOKEN         # a Viewer service account token, in .env
    client_cert: /certs/client.crt
    client_key: /certs/client.key
    window_hours: 6
    dashboards:
      - https://grafana.example.com/d/abc123/pipeline?var-source=$__all

# Optional: Follow-up — the PRs you approved, followed until they have landed: merged, and every
# check that ran on the merge commit green (apply, deploy, release). A dismissed approval, a PR
# still open after stale_days, a post-merge failure (Claude investigates) or a revert become items.
# Remove the block to hide the tab.
followup:
  enabled: true
  interval_seconds: 300
  authors: [renovate, dependabot]  # bots whose PRs merge without their author watching (author:app/<login>); `all` = every PR you approve
  stale_days: 3                    # approved longer ago than this and still open → one push, re-armed every stale_days
  window_days: 7                   # merged/closed PRs followed for this long

# Optional: how Sentinel decides to interrupt you (defaults shown)
# triage:
#   team_grace_minutes: 60         # team review requests: pushed only if still unclaimed after this
#   health_minutes: 30             # a source failing this long becomes an item
#   stale_review_days: 3           # your PR without movement this long → "nudge a reviewer"

# Optional: Claude through contrib/claude-bridge (needs CLAUDE_BRIDGE_URL in .env; defaults shown)
# agents:
#   precheck: true                 # read each dependency bump before you approve it
#   followup: true                 # investigate a fresh post-merge failure of a PR you approved
#   max_runs_per_day: 30           # automatic runs only; on-demand reviews are never capped
#   concurrency: 2

# Optional: Cycle tab — objectives from a Slite note, progress from Shortcut epics.
# Needs SLITE_API_KEY and SHORTCUT_API_TOKEN in .env, remove the block to hide the tab.
# It follows the cycle on its own: newest note under parent_id, dates read off its title,
# highest `<prefix>-<year>-C<n>` label, and the epics carrying it whose name contains the
# big rock title. Only the exceptions below need touching.
cycle:
  enabled: false
  interval_seconds: 1800
  owner: Your Name                # matches the `_Owner_ @Your Name` line of a note section
  shortcut_member: yourmention    # Shortcut mention name, flags your own stories
  stall_days: 7                   # no Shortcut activity for that long → one push
  behind_points: 10               # outputs delivered this far under the elapsed cycle → behind
  slite:
    parent_id: xxxxxxxxxxxx       # collection holding one note per cycle
    # note_id: yyyyyyyyyyyy       # pin one note instead of taking the newest
  # label_prefix: Team            # cycle labels look like Team-2026-C5
  # label: Team-2026-C5           # pin one label instead of taking the highest
  # start: 2026-09-01             # fallback when the note title carries no months
  # end: 2026-10-31
  epics:                          # override: big rock title → epic ids, for the odd one out
    "Some big rock": [12345]
  run:
    label: RUN
    match: RUN my-service         # the cycle epic whose name contains this
