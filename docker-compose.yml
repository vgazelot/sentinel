services:
  sentinel:
    build: ./app
    restart: always
    ports:
      - "127.0.0.1:8300:8000"
    env_file: .env
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
