# The bridge's own tmux server (tmux -L sentinel): one session per Sentinel console, Claude Code in each.
# Claude Code is the only program in there: no prefix key (Ctrl-B is Claude's), no status line, the wheel
# scrolls back through the session's history, Esc reaches Claude at once.
set -g prefix None
unbind-key C-b
set -g status off
set -g mouse on
set -g history-limit 50000
set -g window-size latest
set -g default-terminal "xterm-256color"
# Claude's links (OSC 8) reach xterm.js: tmux passes them on only to a terminal said to take them
set -as terminal-features "xterm*:hyperlinks"
set -sg escape-time 0
set -g focus-events on
