{% extends "base.html" %}
{% block title %}Sentinel — Sessions{% endblock %}
{% block content %}
<section class="pane list" id="list" hx-get="/partials/sessions" hx-trigger="every 5s, refresh" hx-swap="innerHTML">
    {% include "partials/sessions_list.html" %}
</section>
<section class="pane s-work">
    <nav class="b-pages" id="boards" aria-label="Boards" hidden></nav>
    <div class="board" id="board" aria-label="Terminals">
        <div class="b-empty"><svg><use href="#i-term"/></svg><p>Drag a live session here</p><p class="muted">or select it in the list</p></div>
        <div class="b-drop" hidden><span></span></div>
        <div class="b-edge" hidden><span></span></div>
    </div>
    <div class="s-detail" id="detail">
        <div class="d-empty"><p>Select a session or a ticket</p><p class="muted"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>⏎</kbd> open</p></div>
    </div>
</section>
<script src="/static/sessions.js"></script>
<script src="/static/board.js"></script>
{% endblock %}
