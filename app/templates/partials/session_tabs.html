{# the live sessions as tabs over the pane, grouped by big rock: shown in focus when the list makes way (static/sessions.js) #}
<nav class="tabs" id="tabs" aria-label="Live sessions"{% if tabs_oob %} hx-swap-oob="true"{% endif %}>
    <button type="button" class="icon-btn" data-overview title="Back to every ticket (Esc)"><svg><use href="#i-grid"/></svg></button>
    <div class="tabs-scroll">
        <i class="tab-ind" aria-hidden="true"></i>
        {% for g in groups %}{% set live = g.rows | selectattr('session') | list %}{% if live %}
        <div class="tg">
            <span class="tg-l" title="{{ g.title }}">{{ g.title }}</span>
            {% for r in live %}<button type="button" class="tab" data-key="{{ r.key }}" title="{{ (r.title | subject).text }} · {{ r.word }}"><svg class="ic {{ r.tone }}"><use href="#{{ r.icon }}"/></svg><span>{{ (r.title | subject).text }}</span></button>{% endfor %}
        </div>
        {% endif %}{% endfor %}
    </div>
    <button type="button" class="icon-btn" data-tabs title="The list on the left (⌥0)"><svg><use href="#i-panel"/></svg></button>
    <button type="button" class="icon-btn" data-unselect hx-get="/partials/session?key=new" hx-target="#detail" title="New session"><svg><use href="#i-plus"/></svg></button>
</nav>
