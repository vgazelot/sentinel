<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentinel{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%237c5cff%22 stroke-width=%2212%22/><circle cx=%2250%22 cy=%2250%22 r=%2214%22 fill=%22%2338bdf8%22/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-bs-theme="dark">
<nav class="navbar navbar-expand sentinel-nav sticky-top">
    <div class="container">
        <a class="navbar-brand mb-0 h1 sentinel-brand" href="/">◉ Sentinel</a>
        <ul class="navbar-nav ms-3 me-auto">
            <li class="nav-item">
                <a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active == 'todo' %}active{% endif %}" href="/todo">Todo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active == 'history' %}active{% endif %}" href="/history">History</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active == 'settings' %}active{% endif %}" href="/settings">Settings</a>
            </li>
        </ul>
    </div>
</nav>
<main class="container py-3" style="max-width: 900px;">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="/static/app.js"></script>
</body>
</html>
